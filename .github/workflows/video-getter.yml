## نحوه استخراج ویدیوهای چندقسمتی

اگر ویدیو بزرگتر از ۸۵ مگابایت باشد، به چند قسمت تقسیم می‌شود:

- فایل اول: `video.zip`
- فایل دوم: `video.z01`
- فایل سوم: `video.z02`
- ...

**مراحل استخراج:**

1. **همه قسمت‌ها** را دانلود کنید (حتماً در یک پوشه).
2. روی فایل `video.zip` کلیک راست کرده و **7-Zip → Extract Here** را انتخاب کنید.
3. (اگر رمز گذاشته باشید، رمز را وارد کنید.)
4. ویدیوی کامل خارج می‌شود.

> اگر 7-Zip ندارید، از [این لینک](https://www.7-zip.org/) نصب کنید. نرم‌افزارهای دیگر مثل WinRAR هم می‌توانند این فایل‌ها را باز کنند.
