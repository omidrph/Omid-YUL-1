name: 01 - 🎬 دانلود یوتیوب

on:
  workflow_dispatch:
    inputs:
      video_urls:
        description: '🔗 لینک ویدیو (چند لینک با فاصله)'
        required: true
        type: string
      download_subtitles:
        description: '📝 زیرنویس (فارسی و انگلیسی)'
        required: false
        default: false
        type: boolean
      quality:
        description: '🎬 کیفیت و نوع'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      password:
        description: '🔒 رمز (اختیاری برای محافظت)'
        required: false
        default: ''
        type: string

jobs:
  download-video:
    name: "📥 دانلود ویدیو از یوتیوب"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Check URL provided
        run: |
          if [ -z "${{ github.event.inputs.video_urls }}" ]; then
            echo ""
            echo "❌ لینک ویدیو وارد نشده است!"
            echo ""
            echo "📌 راهنما:"
            echo "   1️⃣ workflow را دوباره اجرا کنید"
            echo "   2️⃣ در فیلد 'لینک ویدیو' آدرس را وارد کنید"
            echo "   3️⃣ برای چند ویدیو، لینک‌ها را با فاصله جدا کنید"
            echo ""
            exit 1
          fi
          echo "✅ لینک ویدیو دریافت شد"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git for large files
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 100m
          git config --global pack.threads 1
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          echo "Git configured for large file handling"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg zip p7zip-full curl jq bc unzip

          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          deno --version

          pip3 install --upgrade yt-dlp

      - name: Start WARP proxy (for bypass)
        run: |
          echo "Starting Cloudflare WARP container..."

          docker network create warp-net || true

          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          echo "Waiting for WARP to initialize (15 seconds)..."
          sleep 15

          echo "Checking WARP status..."
          for i in {1..5}; do
            RESULT=$(curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP is active!"
              echo "$RESULT"
              break
            else
              echo "Attempt $i/5 - WARP not ready yet, waiting..."
              sleep 5
            fi
          done

          FINAL=$(curl -s --max-time 10 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
          if echo "$FINAL" | grep -qE "warp=(on|plus)"; then
            echo "WARP proxy is ready!"
          else
            echo "WARP might not be fully active, but continuing anyway..."
          fi

      - name: Download videos from YouTube
        run: |
          URLS="${{ github.event.inputs.video_urls }}"
          QUALITY="${{ github.event.inputs.quality }}"
          ZIP_PASSWORD="${{ github.event.inputs.password }}"
          DOWNLOAD_SUBS="${{ github.event.inputs.download_subtitles }}"

          SPLIT_MB=45
          SPLIT_BYTES=$(( SPLIT_MB * 1024 * 1024 ))

          BACKUP_DIR="/tmp/video_backup_$$"
          mkdir -p "$BACKUP_DIR"
          echo "$BACKUP_DIR" > /tmp/backup_dir_path.txt

          mkdir -p videos
          > /tmp/video_info.txt

          echo "=========================================="
          echo "🎬 YouTube Downloader Started"
          echo "=========================================="
          echo "Quality: $QUALITY"
          echo "Split size: ${SPLIT_MB}MB"
          if [ -n "$ZIP_PASSWORD" ]; then
            echo "Password protection: ENABLED"
          else
            echo "Password protection: DISABLED"
          fi
          if [ "$DOWNLOAD_SUBS" = "true" ]; then
            echo "Subtitles: ENABLED (en, fa)"
          else
            echo "Subtitles: DISABLED"
          fi
          echo "=========================================="

          sanitize_name() {
            echo "$1" | sed 's/ /-/g' | sed 's/　/-/g' | tr -s '-'
          }

          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          # Format selection based on quality
          case "$QUALITY" in
            "audio")
              FORMAT="bestaudio/bestaudio*/best"
              ;;
            "best")
              FORMAT="bestvideo+bestaudio/bestvideo*+bestaudio*/best"
              ;;
            "2160")
              FORMAT="bestvideo[height<=2160]+bestaudio/bestvideo[height<=2160]*+bestaudio*/bestvideo+bestaudio/best"
              ;;
            "1440")
              FORMAT="bestvideo[height<=1440]+bestaudio/bestvideo[height<=1440]*+bestaudio*/bestvideo+bestaudio/best"
              ;;
            "1080")
              FORMAT="bestvideo[height<=1080]+bestaudio/bestvideo[height<=1080]*+bestaudio*/bestvideo+bestaudio/best"
              ;;
            "720")
              FORMAT="bestvideo[height<=720]+bestaudio/bestvideo[height<=720]*+bestaudio*/bestvideo+bestaudio/best"
              ;;
            "480")
              FORMAT="bestvideo[height<=480]+bestaudio/bestvideo[height<=480]*+bestaudio*/bestvideo+bestaudio/best"
              ;;
            *)
              FORMAT="bestvideo+bestaudio/bestvideo*+bestaudio*/best"
              ;;
          esac

          RANDOM_WORDS=("alpha" "beta" "gamma" "delta" "epsilon" "zeta" "theta" "kappa" "lambda" "sigma" "omega" "nova" "star" "moon" "sun" "sky" "cloud" "river" "ocean" "mountain")

          get_random_word() {
            echo "${RANDOM_WORDS[$RANDOM % ${#RANDOM_WORDS[@]}]}_$RANDOM"
          }

          get_unique_folder() {
            local BASE_PATH="$1"
            local NAME="$2"
            if [ ! -d "$BASE_PATH/$NAME" ] && [ ! -d "$BACKUP_DIR/$NAME" ]; then
              echo "$NAME"
              return
            fi
            local RANDOM_SUFFIX=$(get_random_word)
            while [ -d "$BASE_PATH/${NAME}_${RANDOM_SUFFIX}" ] || [ -d "$BACKUP_DIR/${NAME}_${RANDOM_SUFFIX}" ]; do
              RANDOM_SUFFIX=$(get_random_word)
            done
            echo "${NAME}_${RANDOM_SUFFIX}"
          }

          normalize_youtube_url() {
            local INPUT_URL="$1"
            if [[ "$INPUT_URL" =~ youtu\.be/([a-zA-Z0-9_-]+) ]]; then
              VIDEO_ID="${BASH_REMATCH[1]}"
              VIDEO_ID="${VIDEO_ID%%\?*}"
              echo "https://www.youtube.com/watch?v=${VIDEO_ID}"
            else
              echo "$INPUT_URL"
            fi
          }

          download_video() {
            local METHOD=$1
            local URL=$2
            local TMP_DIR=$3

            if [ "$QUALITY" = "audio" ]; then
              COMMON_FLAGS="--extract-audio --audio-format mp3 --audio-quality 0 --write-thumbnail --convert-thumbnails jpg --no-cache-dir --output ${TMP_DIR}/%(title)s.%(ext)s --no-part --no-playlist --retries 5 --fragment-retries 5 --no-check-certificates --concurrent-fragments 8 --buffer-size 16K --http-chunk-size 10M --progress --newline"
            else
              COMMON_FLAGS="--merge-output-format mp4 --write-thumbnail --convert-thumbnails jpg --no-cache-dir --output ${TMP_DIR}/%(title)s.%(ext)s --no-part --no-playlist --retries 5 --fragment-retries 5 --no-check-certificates --concurrent-fragments 8 --buffer-size 16K --http-chunk-size 10M --progress --newline"
            fi

            case $METHOD in
              1)
                yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" $COMMON_FLAGS --extractor-args "youtube:player_client=web" --js-runtimes deno --remote-components ejs:github --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" --add-header "Accept-Language:en-US,en;q=0.9" "$URL"
                ;;
              2)
                yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" $COMMON_FLAGS --extractor-args "youtube:player_client=web" --js-runtimes deno --remote-components ejs:npm --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" --add-header "Accept-Language:en-US,en;q=0.9" "$URL"
                ;;
              3)
                yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" $COMMON_FLAGS --extractor-args "youtube:player_client=web,mweb,android_vr" --js-runtimes deno --remote-components ejs:github "$URL"
                ;;
              4)
                yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" $COMMON_FLAGS --extractor-args "youtube:player_client=mweb" "$URL"
                ;;
              5)
                yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" $COMMON_FLAGS --extractor-args "youtube:player_client=android_vr" "$URL"
                ;;
              6)
                yt-dlp --format "$FORMAT" $COMMON_FLAGS --extractor-args "youtube:player_client=web" --js-runtimes deno --remote-components ejs:github "$URL"
                ;;
              7)
                yt-dlp --format "$FORMAT" $COMMON_FLAGS --extractor-args "youtube:player_client=mweb" "$URL"
                ;;
              8)
                yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" $COMMON_FLAGS --extractor-args "youtube:player_client=android" --user-agent "Mozilla/5.0 (Linux; Android 12; SM-S906N Build/QP1A.190711.020) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Mobile Safari/537.36" "$URL"
                ;;
            esac
          }

          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"

          echo "$FORMAT" > /tmp/yt_format.txt
          echo "$QUALITY" > /tmp/yt_quality.txt
          echo "$ZIP_PASSWORD" > /tmp/yt_password.txt
          echo "$BACKUP_DIR" > /tmp/backup_dir_path.txt
          echo "$REPO_OWNER" > /tmp/yt_repo_owner.txt
          echo "$REPO_NAME" > /tmp/yt_repo_name.txt
          echo "$BRANCH" > /tmp/yt_branch.txt

          IFS=' ' read -ra URL_ARRAY <<< "$URLS"
          printf "%s\n" "${URL_ARRAY[@]}" > /tmp/yt_urls.txt
          TOTAL_URLS=${#URL_ARRAY[@]}

          URL_INDEX=0
          for URL in "${URL_ARRAY[@]}"; do
            URL_INDEX=$((URL_INDEX + 1))
            URL=$(normalize_youtube_url "$URL")

            echo ""
            echo "============================================================"
            echo "Processing URL $URL_INDEX / $TOTAL_URLS : $URL"
            echo "============================================================"

            TMP_DIR="tmp_downloads_${URL_INDEX}"
            mkdir -p "$TMP_DIR"

            DOWNLOAD_SUCCESS=false
            for METHOD in 1 2 3 4 5 6 7 8; do
              echo "Trying download method $METHOD..."
              if download_video $METHOD "$URL" "$TMP_DIR"; then
                echo "✅ Download successful with method $METHOD!"
                DOWNLOAD_SUCCESS=true
                break
              else
                echo "Method $METHOD failed, waiting 3 seconds..."
                sleep 3
              fi
            done

            if [ "$DOWNLOAD_SUCCESS" = false ]; then
              echo "❌ All download methods failed for URL: $URL — skipping."
              rm -rf "$TMP_DIR"
              continue
            fi

            find "$TMP_DIR" -name "*.part" -delete

            echo "Files in $TMP_DIR:"
            ls -la "$TMP_DIR/"

            for FILE in "$TMP_DIR"/*; do
              [ -f "$FILE" ] || continue
              if [[ "$FILE" == *.jpg ]] || [[ "$FILE" == *.webp ]]; then
                continue
              fi

              SIZE=$(stat -c%s "$FILE")
              BASENAME=$(basename "$FILE")
              FILENAME_NO_EXT="${BASENAME%.*}"
              EXT="${BASENAME##*.}"
              FILENAME_NO_EXT=$(sanitize_name "$FILENAME_NO_EXT")

              echo "Processing: $BASENAME ($(( SIZE / 1024 / 1024 ))MB)"

              FINAL_FOLDER_NAME=$(get_unique_folder "videos" "$FILENAME_NO_EXT")
              mkdir -p "$BACKUP_DIR/${FINAL_FOLDER_NAME}"

              THUMB_FILE=$(ls "$TMP_DIR"/*.jpg 2>/dev/null | head -1)
              if [ -n "$THUMB_FILE" ] && [ -f "$THUMB_FILE" ]; then
                cp "$THUMB_FILE" "$BACKUP_DIR/${FINAL_FOLDER_NAME}/thumbnail.jpg"
                echo "✅ Thumbnail saved"
              fi

              echo "${FILENAME_NO_EXT}|${FINAL_FOLDER_NAME}|${URL}" >> /tmp/video_info.txt
              FOLDER_ENCODED=$(urlencode "${FINAL_FOLDER_NAME}")

              if [ "$SIZE" -gt "$SPLIT_BYTES" ]; then
                echo "Splitting into ${SPLIT_MB}MB parts..."

                if [ -n "$ZIP_PASSWORD" ]; then
                  7z a -tzip -v${SPLIT_MB}m -p"${ZIP_PASSWORD}" -mx=0 "$BACKUP_DIR/${FINAL_FOLDER_NAME}/${FINAL_FOLDER_NAME}.zip" "$FILE"
                else
                  zip -0 -s ${SPLIT_MB}m "$BACKUP_DIR/${FINAL_FOLDER_NAME}/${FINAL_FOLDER_NAME}.zip" "$FILE"
                fi

                cat > "$BACKUP_DIR/${FINAL_FOLDER_NAME}/README.md" << EOF
# ${FILENAME_NO_EXT}

---

## Video Information

| Property | Value |
|----------|-------|
| **Video Name** | \`${FILENAME_NO_EXT}\` |
| **Original Link** | [YouTube Video](${URL}) |
| **Quality** | **${QUALITY}** |
| **Password Protected** | **$(if [ -n "$ZIP_PASSWORD" ]; then echo "YES"; else echo "NO"; fi)** |

## Download Links

Download all parts, then open \`${FINAL_FOLDER_NAME}.zip\`

| # | File |
|---|------|
EOF
                PART_NUM=0
                for PART in $(ls "$BACKUP_DIR/${FINAL_FOLDER_NAME}/"*.zip "$BACKUP_DIR/${FINAL_FOLDER_NAME}/"*.z[0-9]* 2>/dev/null | sort -V); do
                  PART_NUM=$((PART_NUM + 1))
                  PART_NAME=$(basename "$PART")
                  echo "| ${PART_NUM} | \`${PART_NAME}\` |" >> "$BACKUP_DIR/${FINAL_FOLDER_NAME}/README.md"
                done

                cat >> "$BACKUP_DIR/${FINAL_FOLDER_NAME}/README.md" << EOF

## How to Extract

Download all parts into the same folder, then open \`${FINAL_FOLDER_NAME}.zip\` with 7-Zip or WinRAR.
$(if [ -n "$ZIP_PASSWORD" ]; then echo "Enter password when prompted."; fi)

---
*Downloaded: $(date '+%Y-%m-%d %H:%M:%S UTC')*
EOF
              else
                if [ -n "$ZIP_PASSWORD" ]; then
                  zip -0 -P "${ZIP_PASSWORD}" "$BACKUP_DIR/${FINAL_FOLDER_NAME}/${FINAL_FOLDER_NAME}.zip" "$FILE"
                else
                  cp "$FILE" "$BACKUP_DIR/${FINAL_FOLDER_NAME}/${FINAL_FOLDER_NAME}.${EXT}"
                fi

                cat > "$BACKUP_DIR/${FINAL_FOLDER_NAME}/README.md" << EOF
# ${FILENAME_NO_EXT}

---

## Video Information

| Property | Value |
|----------|-------|
| **Video Name** | \`${FILENAME_NO_EXT}\` |
| **Original Link** | [YouTube Video](${URL}) |
| **Quality** | **${QUALITY}** |
| **Password Protected** | **$(if [ -n "$ZIP_PASSWORD" ]; then echo "YES"; else echo "NO"; fi)** |

## How to Extract

$(if [ -n "$ZIP_PASSWORD" ]; then echo "Extract with password using 7-Zip or WinRAR."; else echo "No extraction needed — file is ready to use."; fi)

---
*Downloaded: $(date '+%Y-%m-%d %H:%M:%S UTC')*
EOF
              fi
            done

            rm -rf "$TMP_DIR"
            echo "✅ Finished URL $URL_INDEX / $TOTAL_URLS"
          done

      - name: Download subtitles (optional)
        if: ${{ github.event.inputs.download_subtitles == 'true' }}
        run: |
          set +e

          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          REPO_OWNER=$(cat /tmp/yt_repo_owner.txt)
          REPO_NAME=$(cat /tmp/yt_repo_name.txt)
          BRANCH=$(cat /tmp/yt_branch.txt)

          download_subtitles() {
            local URL="$1"
            local OUTPUT_DIR="$2"

            for METHOD in 1 2 3 4 5 6 7 8; do
              yt-dlp --proxy "socks5://127.0.0.1:1080" \
                --write-sub --sub-langs fa,en \
                --sub-format vtt \
                --convert-subs vtt \
                --skip-download \
                --no-playlist \
                --output "${OUTPUT_DIR}/%(title)s.%(ext)s" \
                "$URL" 2>&1 && return 0
              sleep 2
            done
            return 1
          }

          while IFS='|' read -r ORIGINAL_NAME FOLDER_NAME VIDEO_URL; do
            [ -z "$FOLDER_NAME" ] && continue

            SUBTITLE_DIR="$BACKUP_DIR/${FOLDER_NAME}/subtitle"
            mkdir -p "$SUBTITLE_DIR"

            echo "Downloading subtitles for: $FOLDER_NAME"
            download_subtitles "$VIDEO_URL" "$SUBTITLE_DIR"

            SUB_COUNT=$(find "$SUBTITLE_DIR" -type f 2>/dev/null | wc -l)
            if [ "$SUB_COUNT" -gt 0 ]; then
              (cd "$SUBTITLE_DIR" && zip -j "$BACKUP_DIR/${FOLDER_NAME}/subtitles.zip" ./* 2>&1)
              rm -rf "$SUBTITLE_DIR"
              echo "✅ Subtitles saved for: $FOLDER_NAME"
            else
              rmdir "$SUBTITLE_DIR" 2>/dev/null || true
            fi
          done < /tmp/video_info.txt

          set -e
          exit 0

      - name: Stop WARP container
        if: always()
        run: |
          docker stop warp || true
          docker rm warp || true

      - name: Push videos to repository
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)

          BACKUP_FILE_COUNT=$(find "$BACKUP_DIR" -type f 2>/dev/null | wc -l)
          if [ "$BACKUP_FILE_COUNT" -eq 0 ]; then
            echo "No files to push."
            exit 0
          fi

          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          git fetch origin "$BRANCH"
          git reset --hard origin/"$BRANCH"

          mkdir -p videos
          cp -r "$BACKUP_DIR"/* videos/

          # Generate master README
          cat > videos/README.md << EOF
# 🎬 YouTube Downloads

| # | Video | Link |
|---|-------|------|
EOF

          COUNTER=1
          for folder in videos/*/; do
            [ -d "$folder" ] || continue
            FOLDER_NAME=$(basename "$folder")
            FOLDER_ENCODED=$(urlencode "$FOLDER_NAME")
            echo "| ${COUNTER} | ${FOLDER_NAME} | [Open](./${FOLDER_ENCODED}/) |" >> videos/README.md
            COUNTER=$((COUNTER + 1))
          done

          git add videos/
          git diff --cached --quiet || git commit -m "Add YouTube videos [skip ci]"

          PUSH_RETRY=0
          while [ $PUSH_RETRY -lt 5 ]; do
            PUSH_RETRY=$((PUSH_RETRY + 1))
            if git push origin HEAD:"$BRANCH"; then
              echo "✅ Push successful!"
              break
            else
              echo "Push failed, retry $PUSH_RETRY/5..."
              sleep 5
              git fetch origin "$BRANCH"
              git reset --hard origin/"$BRANCH"
              mkdir -p videos
              cp -r "$BACKUP_DIR"/* videos/
              git add videos/
              git diff --cached --quiet || git commit -m "Add YouTube videos [skip ci]"
            fi
          done

          echo "=========================================="
          echo "✅ YouTube download completed successfully"
          echo "=========================================="
